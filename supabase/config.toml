[functions.fetch-og-image]
enabled = true
verify_jwt = false
import_map = "./functions/fetch-og-image/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/fetch-og-image/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/fetch-og-image/*.html" ]

[functions.checkin-event]
enabled = true
verify_jwt = true
entrypoint = "./functions/checkin-event/index.ts"

[functions.checkin-page]
enabled = true
verify_jwt = false
entrypoint = "./functions/checkin-page/index.ts"

[functions.generate-event-qr]
enabled = true
verify_jwt = true
entrypoint = "./functions/generate-event-qr/index.ts"